const canvas = document.getElementById('c');

const T = 16;
let W = 240, H = 160;      // tamaño de la vista en píxeles del juego (se calcula solo)
let K = 3;                 // zoom: píxeles de pantalla por cada píxel del juego
let zoomManual = 0;        // 0 = automático; con + y - lo cambias a mano

function resize() {
  K = zoomManual || Math.max(2, Math.round(innerHeight / 256));
  W = Math.ceil(innerWidth / K);
  H = Math.ceil(innerHeight / K);
  canvas.width = W; canvas.height = H;
  g.imageSmoothingEnabled = false;
  canvas.style.width = (W * K) + 'px'; canvas.style.height = (H * K) + 'px';
}
addEventListener('resize', resize);
resize();

// ------------------------------------------------------------
//  TEXTO PIXELADO (letra irregular, sin suavizar)
//  Se dibuja la frase pequeña y se corta cada píxel a "sí / no".
// ------------------------------------------------------------
const FONT = 'bold 9px Arial, Helvetica, sans-serif';
const tctx = document.createElement('canvas').getContext('2d');
tctx.font = FONT;
const textCache = new Map();
const hexRGB = h => [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)];
function textW(s) { tctx.font = FONT; return tctx.measureText(s).width; }
function textImg(s, color) {
  const key = color + '|' + s;
  let c = textCache.get(key);
  if (c) return c;
  const w = Math.ceil(textW(s)) + 2, h = 13;
  c = document.createElement('canvas'); c.width = w; c.height = h;
  const x = c.getContext('2d');
  x.font = FONT; x.textBaseline = 'top'; x.fillStyle = color; x.fillText(s, 1, 1);
  const id = x.getImageData(0, 0, w, h), d = id.data, [r, gg, b] = hexRGB(color);
  for (let i = 0; i < d.length; i += 4) {
    if (d[i + 3] > 110) { d[i] = r; d[i+1] = gg; d[i+2] = b; d[i+3] = 255; } else d[i + 3] = 0;
  }
  x.putImageData(id, 0, 0);
  if (textCache.size > 800) textCache.clear();
  textCache.set(key, c);
  return c;
}
// clip = hasta qué ancho se enseña (efecto máquina de escribir); sc = escala
function ptext(s, x, y, color, clip, sc) {
  sc = sc || 1;
  const c = textImg(s, color);
  let w = c.width;
  if (clip !== undefined && clip !== null) w = Math.min(w, Math.max(0, clip));
  if (w <= 0) return;
  g.drawImage(c, 0, 0, w, c.height, Math.round(x), Math.round(y), w * sc, c.height * sc);
}
function stext(s, x, y, color, sc) {                 // texto con sombra
  ptext(s, x + (sc || 1), y + (sc || 1), '#000000', undefined, sc);
  ptext(s, x, y, color, undefined, sc);
}
function wrapText(text, maxW) {
  const words = text.split(' '), lines = [];
  let cur = '';
  for (const w of words) {
    const t = cur ? cur + ' ' + w : w;
    if (textW(t) > maxW && cur) { lines.push(cur); cur = w; } else cur = t;
  }
  if (cur) lines.push(cur);
  return lines;
}

// ------------------------------------------------------------
//  UTILIDADES DE SPRITES
// ------------------------------------------------------------
function outline(c) {
  const x = c.getContext('2d'), w = c.width, h = c.height;
  const d = x.getImageData(0, 0, w, h).data;
  const out = x.createImageData(w, h), o = out.data;
  const solid = (a, b) => a >= 0 && b >= 0 && a < w && b < h && d[(b * w + a) * 4 + 3] > 0;
  for (let y = 0; y < h; y++) {
    for (let xx = 0; xx < w; xx++) {
      const i = (y * w + xx) * 4;
      if (d[i + 3] > 0) {
        o[i] = d[i]; o[i+1] = d[i+1]; o[i+2] = d[i+2]; o[i+3] = 255;
      } else if (solid(xx+1,y) || solid(xx-1,y) || solid(xx,y+1) || solid(xx,y-1)) {
        o[i] = 26; o[i+1] = 18; o[i+2] = 32; o[i+3] = 255;
      }
    }
  }
  x.putImageData(out, 0, 0);
}
function flip(c) {
  const f = document.createElement('canvas');
  f.width = c.width; f.height = c.height;
  const x = f.getContext('2d');
  x.translate(c.width, 0); x.scale(-1, 1); x.drawImage(c, 0, 0);
  return f;
}
function hash(x, y) {                                  // número "aleatorio" fijo por casilla
  let h = Math.imul(x, 374761393) ^ Math.imul(y, 668265263);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return (h ^ (h >>> 16)) >>> 0;
}

// ------------------------------------------------------------

function drawFront(R, pose, f) {
  const lL = pose === 2 ? 1 : 0, lR = pose === 1 ? 1 : 0;

  R(4,12,1,1,C.red); R(11,12,1,1,C.red);

function drawBack(R, pose, f) {

  R(2,12,2,4+aL,C.navy); R(2,16+aL,2,1,C.red); R(2,17+aL,2,1,C.skin);

  R(6+f,0,1,1,C.hairY); R(9-f,0,1,1,C.hair);
}
function drawSide(R, pose, f) {
  if (pose === 0) {
    R(7,20,2,2,C.sock); R(5,22,4,2,C.boot); R(5,23,4,1,C.bootD);

    R(5,20-fU,2,2,C.sock); R(3,22-fU,4,2,C.boot); R(3,23-fU,4,1,C.bootD);
  }
  R(5,11,7,7,C.navy); R(5,18,7,1,C.navyD); R(5,19,7,1,C.red);
  R(5,11,2,1,C.red); R(5,12,1,7,C.red);
  R(9,14,2,2,C.navyD); R(10,15,1,1,C.orange);
  for (let x = 6; x < 12; x += 2) R(x,18,1,1,C.red);
  R(14,9,1,1,C.hilt); R(14,10,1,2,C.scab); R(13,12,3,1,C.hilt);
  R(13,13,1,2,C.scab); R(12,15,1,2,C.scab); R(11,17,1,2,C.scab);
  const ax = pose === 1 ? 6 : pose === 2 ? 9 : 7;
  R(ax,12,2,4,C.navy); R(ax,16,2,1,C.red); R(ax,17,2,1,C.skin);
  R(6,10,3,1,C.skin);
  R(5,1,6,1,C.hair); R(4,2,9,3,C.hair);

  R(7+f,0,1,1,C.hairY); R(10-f,1,1,1,C.hairY);
}

// ------------------------------------------------------------
//  EL MAPACHE (gafas redondas y chaqueta marrón)

function drawRaccoon(R, f) {
  const G = '#8a8f99', K2 = '#3a3d46', Wh = '#e6e9ee';
  const J = '#8a5a32', Jd = '#6e4624', Jl = '#a9754a', Jdd = '#5a3a1e';
  for (let i = 0; i < 5; i++) {                       // cola con anillos
    const x = 13 + (i >= 2 ? 1 : 0) + (i >= 3 ? f : 0);
    R(x, 21 - 2 * i, i < 2 ? 3 : 2, 2, i % 2 ? K2 : G);
  }
  R(5,21,2,1,G); R(9,21,2,1,G); R(4,22,3,2,K2); R(9,22,3,2,K2);
  R(4,15,8,6,J); R(4,19,8,2,Jd);
  R(7,15,2,6,'#efe6d0');
  R(5,15,2,2,Jl); R(9,15,2,2,Jl);
  R(6,18,1,1,'#ffd84a'); R(9,18,1,1,'#ffd84a');
  R(4,19,3,1,Jdd); R(9,19,3,1,Jdd);
  R(2,16,2,4,J); R(12,16,2,4,J); R(2,20,2,1,K2); R(12,20,2,1,K2);
  R(3,5,3,3,G); R(10,5,3,3,G); R(4,6,1,2,K2); R(11,6,1,2,K2);
  R(3,7,10,8,G); R(5,7,6,1,'#a3a8b2');
  R(7,7,2,2,K2);
  R(3,9,10,4,K2);
  R(5,13,6,2,Wh); R(7,13,2,1,'#22222a');
  [3, 9].forEach(x0 => {
    R(x0+1,9,2,1,'#e8c86a'); R(x0+1,12,2,1,'#e8c86a');
    R(x0,10,1,2,'#e8c86a'); R(x0+3,10,1,2,'#e8c86a');
    R(x0+1,10,2,2,'#cfe8ff');
  });
  R(7,10,2,1,'#e8c86a');
  R(5,11,1,1,'#22222a'); R(10,11,1,1,'#22222a');
  R(4,10,1,1,'#ffffff'); R(11,10,1,1,'#ffffff');
}

function drawSage(R, f) {

  const S = '#f6cfa3', Sd = '#d9a577', WH = '#f4f4f8', WD = '#cfcfe0', EY = '#1b1b2a';

  R(5,21,3,3,'#4e3220'); R(9,21,3,3,'#4e3220');               // pies

  R(5,6,6,4,S); R(6,7,1,1,EY); R(9,7,1,1,EY); R(7,8,2,1,Sd);           // cara

  R(7,0,2,1,P); R(6,1,4,1,P); R(5,2,6,2,P); R(5,3,6,1,GD);             // sombrero
  R(3,4,10,2,Pd); R(3,4,10,1,Pl); R(8,2,1,1,'#fff6b0');
}

const spriteCache = {};
function getSprite(dir, pose, flame) {
  const key = dir + pose + flame;
  if (spriteCache[key]) return spriteCache[key];
  const c = document.createElement('canvas');
  c.width = 18; c.height = 26;
  const x = c.getContext('2d');
  const R = (a, b, w, h, col) => { x.fillStyle = col; x.fillRect(a + 1, b + 1, w, h); };
  if (dir === 'down') drawFront(R, pose, flame);
  else if (dir === 'up') drawBack(R, pose, flame);
  else drawSide(R, pose, flame);
  outline(c);
  return (spriteCache[key] = (dir === 'right') ? flip(c) : c);
}
function npcSprite(kind, f) {
  const key = kind + f;
  if (spriteCache[key]) return spriteCache[key];
  const c = document.createElement('canvas');
  c.width = 18; c.height = 26;
  const x = c.getContext('2d');
  const R = (a, b, w, h, col) => { x.fillStyle = col; x.fillRect(a + 1, b + 1, w, h); };
  if (kind === 'sage') drawSage(R, f); else drawRaccoon(R, f);
  outline(c);
  return (spriteCache[key] = c);
}

function pRaccoon(R, face) {

  const GL='#e8c86a', LN='#cfe8ff', DK='#22222a';
  R(2,26,28,6,J); R(2,26,28,1,Jl); R(6,25,7,6,Jl); R(19,25,7,6,Jl); R(13,25,6,7,'#efe6d0');
  R(9,29,2,2,'#ffd84a'); R(21,29,2,2,'#ffd84a');
  R(3,2,8,8,G); R(21,2,8,8,G); R(5,4,4,5,K2); R(23,4,4,5,K2); R(3,2,8,1,Gl); R(21,2,8,1,Gl);
  R(7,7,18,1,G); R(5,8,22,3,G); R(4,11,24,14,G); R(8,8,16,1,Gl);
  R(14,7,4,6,K2);
  R(4,14,24,8,K2); R(5,13,22,1,K2);
  R(9,21,14,5,Wh); R(11,26,10,1,Wh);
  R(14,20,4,3,DK); R(15,20,1,1,'#777777');
  R(1,22,5,1,K2); R(1,24,5,1,K2); R(26,22,5,1,K2); R(26,24,5,1,K2);
  const ring = (cx, cy) => {                                   // gafas redondas
    for (let dy = -5; dy <= 5; dy++) for (let dx = -5; dx <= 5; dx++) {
      const d = Math.hypot(dx, dy);
      if (d <= 3.4) R(cx+dx, cy+dy, 1, 1, LN); else if (d <= 4.6) R(cx+dx, cy+dy, 1, 1, GL);
    }
  };
  ring(10, 17); ring(22, 17); R(15, 16, 3, 1, GL);
  const pup = (cx, cy) => { R(cx-1, cy, 2, 2, DK); R(cx-1, cy, 1, 1, '#ffffff'); };

const EGG_W = [4,6,8,10,12,12,14,14,14,14,14,14,14,12,12,10,8,6];   // anchura por fila
const EGG_COL = {
  fuego:  { b:'#e8502a', l:'#ff9a4a', d:'#a82a1a', s:'#ffd84a', g:'#ff8a30', n:'FUEGO' },
  agua:   { b:'#3a8ae8', l:'#7ac0ff', d:'#2058b0', s:'#bfe6ff', g:'#60b0ff', n:'AGUA' },
  tierra: { b:'#6a9a3a', l:'#9acb5a', d:'#3e6a24', s:'#8a5a32', g:'#8ad050', n:'TIERRA' },
  aire:   { b:'#bfe8f0', l:'#ffffff', d:'#80b8cc', s:'#f0d848', g:'#e8faff', n:'AIRE' }
};
function eggPix(type, ex, ey, left, right) {
  const c = EGG_COL[type];
  let col = ex <= left + 1 ? c.l : ex >= right - 1 ? c.d : c.b;
  if (type === 'fuego') {
    if (ey >= 11 && (((ex + 40) % 4) < 2)) col = ex >= right - 1 ? '#8a2010' : '#c83a1a';
    if ((ex === -2 && ey === 5) || (ex === 2 && ey === 7) || (ex === 0 && ey === 3) || (ex === -3 && ey === 9)) col = c.s;
    if (ey === 9 && ex % 2 === 0 && ex > left + 1 && ex < right - 1) col = '#ff7a30';
  } else if (type === 'agua') {
    if (ey % 4 === 2 && (((ex + ey + 40) % 4) < 2)) col = c.l;
    if ((ex === 1 && ey === 4) || (ex === -3 && ey === 9) || (ex === 3 && ey === 12)) col = c.s;
  } else if (type === 'tierra') {
    if (hash(ex + 20, ey) % 6 === 0) col = c.d;
    if ((ex === -3 && ey === 6) || (ex === 2 && ey === 10) || (ex === 0 && ey === 13) || (ex === -1 && ey === 3)) col = c.s;
  } else {
    if (((ex * ex + ey * 2 + 40) % 7) === 0) col = '#ffffff';
    if (ey >= 6 && ey <= 12 && ex === ((ey * 3) % 5) - 2) col = c.s;
    if (ey >= 14 && ey % 2 === 0) col = '#ffffff';
  }
  return col;
}
function pixelEllipse(cx, cy, rx, ry, color, alpha) {
  g.globalAlpha = alpha; g.fillStyle = color;
  for (let j = -ry; j <= ry; j++) {
    const hw = Math.round(rx * Math.sqrt(1 - (j / ry) * (j / ry)));
    g.fillRect(Math.round(cx - hw), Math.round(cy + j), hw * 2, 1);
  }
  g.globalAlpha = 1;
}
function sparkle(x, y, s, col) {
  const cx = Math.round(x), cy = Math.round(y);
  g.fillStyle = col;
  g.fillRect(cx, cy - s, s, 3 * s); g.fillRect(cx - s, cy, 3 * s, s);
}
// cx = centro, baseY = suelo, s = tamaño del píxel, t = tiempo
function drawEgg(type, cx, baseY, s, t, glow) {
  const c = EGG_COL[type], NH = EGG_W.length;
  if (glow) {                                                   // aura que late
    const pulse = 0.5 + 0.5 * Math.sin(t * 3);
    [[14,18,0.10],[11,14,0.12],[8,10,0.14]].forEach(([rx, ry, a]) =>
      pixelEllipse(cx, baseY - 9 * s, rx * s, ry * s, c.g, a * (0.6 + 0.8 * pulse)));
  }
  const burst = Math.sin(t * 0.8) > 0.75;                        // de vez en cuando se agita
  const tilt = Math.sin(t * 3.2) * 1.1 + (burst ? Math.sin(t * 16) * 1.4 : 0);
  const hop = (burst && Math.sin(t * 16) > 0.5) ? 1 : 0;
  const by = baseY - hop * s;
  g.fillStyle = 'rgba(0,0,0,0.28)';
  g.fillRect(cx - 7 * s, baseY - s, 14 * s, s);                  // sombra en el suelo
  const shearOf = ey => Math.round(tilt * (NH - 1 - ey) / (NH - 1));
  for (let ey = 0; ey < NH; ey++) {
    const w = EGG_W[ey], left = -w / 2, right = w / 2 - 1, sh = shearOf(ey);
    for (let ex = left; ex <= right; ex++) {
      const edge = ex === left || ex === right || ey === 0 || ey === NH - 1;
      g.fillStyle = edge ? '#1a1220' : eggPix(type, ex, ey, left, right);
      g.fillRect(cx + (ex + sh) * s, by - (NH - ey) * s, s, s);
    }
  }
  g.fillStyle = '#ffffff';                                       // brillo
  [[-3,4],[-3,5],[-2,3]].forEach(([ex, ey]) => g.fillRect(cx + (ex + shearOf(ey)) * s, by - (NH - ey) * s, s, s));
  if (Math.sin(t * 2.4) > 0.6) {                                 // grieta luminosa
    g.fillStyle = c.s;
    [[-1,4],[0,5],[-1,6],[1,7],[0,8],[1,9]].forEach(([ex, ey]) =>
      g.fillRect(cx + (ex + shearOf(ey)) * s, by - (NH - ey) * s, s, s));
  }
  for (let i = 0; i < 4; i++) {                                  // chispas que giran
    const ang = t * 1.3 + i * Math.PI / 2, r = 11 + 2 * Math.sin(t * 2 + i);
    if (Math.sin(t * 5 + i * 2) > -0.2)
      sparkle(cx + Math.cos(ang) * r * s, by - 9 * s + Math.sin(ang) * r * 0.8 * s, s, i % 2 ? '#ffffff' : c.s);
  }
}

const fill = (x, y, w, h, t) => { for (let j = y; j < y + h; j++) for (let i = x; i < x + w; i++) put(i, j, t); };

function treeOK(x, y) {

const mapCanvas = document.createElement('canvas');
mapCanvas.width = COLS * T; mapCanvas.height = ROWS * T;
const mg = mapCanvas.getContext('2d');

const GROUND = new Set(['.', 'f', 'G', 'S', 'P']);
const isGround = (x, y) => x >= 0 && y >= 0 && x < COLS && y < ROWS && GROUND.has(map[y][x]);
const isPathT = t => t === 'S' || t === 'P';
const isGrassy = t => t === '.' || t === 'f' || t === 'G';

function tileImg(x, y) {
  const t = map[y][x];
  if (t === '.') return TILES['g' + (hash(x, y) % 3)];
  if (t === 'f') return TILES['f' + (hash(x, y) % 3)];
  if (t === 'W' || t === 'Wo') return TILES.W0;
  return TILES[t];
}
function castKind(t) {
  if (t === 'T') return 'tree';
  if (t === 'O' || t === 'F' || t === 'N') return 'small';
  if (t.startsWith('rt-') || t.startsWith('rb-') || t === 'wl' || t === 'wn' || t === 'dr' || t === 'sg') return 'build';
  return null;
}
function bakeMap() {
  for (let y = 0; y < ROWS; y++)
    for (let x = 0; x < COLS; x++) mg.drawImage(tileImg(x, y), x * T, y * T);

  for (let y = 0; y < ROWS; y++) {
    for (let x = 0; x < COLS; x++) {
      const t = map[y][x];
      if (!isPathT(t)) continue;
      const dark = t === 'S' ? '#b9ae8e' : '#c6a96c', light = t === 'S' ? '#f5f0e0' : '#f0dfb0';
      [[0,-1],[0,1],[-1,0],[1,0]].forEach(([dx, dy]) => {
        const row = map[y + dy], n = row ? row[x + dx] : undefined;
        if (!n || !isGrassy(n)) return;
        const px = x * T, py = y * T;
        if (dy === -1) { mg.fillStyle = dark; mg.fillRect(px, py, 16, 1); mg.fillStyle = light; mg.fillRect(px, py + 1, 16, 1); }
        if (dy === 1)  { mg.fillStyle = dark; mg.fillRect(px, py + 15, 16, 1); mg.fillStyle = light; mg.fillRect(px, py + 14, 16, 1); }
        if (dx === -1) { mg.fillStyle = dark; mg.fillRect(px, py, 1, 16); mg.fillStyle = light; mg.fillRect(px + 1, py, 1, 16); }
        if (dx === 1)  { mg.fillStyle = dark; mg.fillRect(px + 15, py, 1, 16); mg.fillStyle = light; mg.fillRect(px + 14, py, 1, 16); }
      });
    }
  }

  const sl = document.createElement('canvas');
  sl.width = mapCanvas.width; sl.height = mapCanvas.height;
  const sg = sl.getContext('2d');
  sg.fillStyle = '#0c1e38';
  for (let y = 0; y < ROWS; y++) {
    for (let x = 0; x < COLS; x++) {
      const kind = castKind(map[y][x]);
      if (!kind) continue;
      [[0,1],[1,0],[1,1]].forEach(([dx, dy]) => {
        const tx = x + dx, ty = y + dy;
        if (!isGround(tx, ty)) return;
        sg.save();
        sg.beginPath(); sg.rect(tx * T, ty * T, T, T); sg.clip();
        if (kind === 'tree') {
          const cx = x * T + 12, cy = y * T + 12;
          for (let j = -7; j <= 7; j++) {
            const hw = Math.round(11 * Math.sqrt(1 - (j / 7) * (j / 7)));
            sg.fillRect(cx - hw, cy + j, hw * 2, 1);
          }
        } else if (kind === 'small') sg.fillRect(x * T + 3, y * T + 6, T, 10);
        else sg.fillRect(x * T + 6, y * T + 6, T, T);
        sg.restore();
      });
    }
  }
  mg.globalAlpha = 0.3;
  mg.drawImage(sl, 0, 0);
  mg.globalAlpha = 1;
}
bakeMap();

const DIRS = { up:[0,-1], down:[0,1], left:[-1,0], right:[1,0] };
const BASE = { right:0, down:Math.PI/2, left:Math.PI, up:-Math.PI/2 };
const STEP = 0.2;
const ATT = 0.4;

const P = {
  tx: 22, ty: 20, x: 22 * T, y: 20 * T,
  fx: 0, fy: 0, gx: 0, gy: 0,
  dir: 'up', moving: false, t: 0, foot: 1,

};

  const n = npcAt(P.tx + dx, P.ty + dy);
  if (n) n.talk();
}

let held = [];
const KEYDIR = { arrowup:'up', arrowdown:'down', arrowleft:'left', arrowright:'right' };
addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  const m = KEYDIR[k];
  if (m) {
    e.preventDefault();
    if (D.active) {
      if (D.opts && D.shown >= D.total && !e.repeat) {
        if (m === 'up') D.sel = (D.sel + D.opts.length - 1) % D.opts.length;
        if (m === 'down') D.sel = (D.sel + 1) % D.opts.length;
      }
    } else if (!menu.open && !reveal && !held.includes(m)) held.push(m);
  }
  if (k === 'a' && !e.repeat && !D.active && !menu.open && !reveal) P.qA = 0.25;
  if ((k === 'e' || k === 'enter') && !e.repeat) {       // E o Intro
    e.preventDefault();
    if (reveal) { if (reveal.t > 0.8) closeReveal(); }
    else if (D.active) pressE();
    else if (!menu.open) P.qE = 0.25;
  }
  if (k === 'm' && !e.repeat && !D.active && !reveal) {  // menú
    menu.open = !menu.open;
    if (menu.open) held = [];
  }
  if (k === 'escape' && menu.open) menu.open = false;
  if ((k === '+' || k === '=') && !e.repeat) { zoomManual = Math.min(6, K + 1); resize(); }
  if ((k === '-' || k === '_') && !e.repeat) { zoomManual = Math.max(2, K - 1); resize(); }
});
addEventListener('keyup', e => {
  const m = KEYDIR[e.key.toLowerCase()];
  if (m) held = held.filter(d => d !== m);
});
addEventListener('blur', () => { held = []; });

// ------------------------------------------------------------
//  PARTÍCULAS MORADAS
// ------------------------------------------------------------
const parts = [];
const PCOLS = ['#b44cff', '#d98cff', '#7a2fd1', '#f0c8ff'];
function spawn(x, y) {
  parts.push({
    x, y,
    vx: (Math.random() - 0.5) * 34, vy: (Math.random() - 0.5) * 34 - 8,
    life: 0, max: 0.35 + Math.random() * 0.4,
    c: PCOLS[(Math.random() * 4) | 0], s: Math.random() < 0.3 ? 2 : 1
  });
}
function swordInfo() {
  const t = P.atk / ATT;
  const u2 = t < 0.2 ? 0 : Math.min(1, (t - 0.2) / 0.45);
  const e = u2 * u2 * (3 - 2 * u2);
  return { t, u: u2, ang: BASE[P.dir] + (-1.2 + 2.4 * e) };
}

// ------------------------------------------------------------
//  ACTUALIZAR
//  Con el menú o la escena del huevo abiertos, el juego se PARA:
//  solo avanza "time", que mueve las animaciones (agua, pelo, cola, huevo...).
// ------------------------------------------------------------
function update(dt) {
  time += dt;
  if (reveal) { reveal.t += dt; return; }
  if (menu.open) return;

  P.qA = Math.max(0, P.qA - dt); P.qE = Math.max(0, P.qE - dt);
  if (D.active && D.shown < D.total) D.shown = Math.min(D.total, D.shown + dt * 45);

  if (P.atk >= 0) {
    P.atk += dt;
    const s = swordInfo();
    if (s.t >= 0.2 && s.t <= 0.7) {
      const ox = P.x + 8, oy = P.y + 7;
      for (let i = 0; i < 3; i++) {
        const r = i === 0 ? 14 : 6 + Math.random() * 8;
        spawn(ox + Math.cos(s.ang) * r, oy + Math.sin(s.ang) * r);
      }
    }
    if (P.atk >= ATT) P.atk = -1;
  }

  if (P.moving) {
    P.t += dt / STEP;
    if (P.t >= 1) {
      P.moving = false; P.x = P.gx; P.y = P.gy;
      P.tx = Math.round(P.x / T); P.ty = Math.round(P.y / T);
    } else {
      P.x = P.fx + (P.gx - P.fx) * P.t;
      P.y = P.fy + (P.gy - P.fy) * P.t;
    }
  }

  if (!P.moving && P.atk < 0 && !D.active) {
    if (P.qE > 0) { P.qE = 0; interact(); }
    else if (P.qA > 0) { P.qA = 0; P.atk = 0; }
    else if (held.length) {
      const d = held[held.length - 1];
      P.dir = d;
      const [dx, dy] = DIRS[d];
      if (!isSolid(P.tx + dx, P.ty + dy)) {
        P.moving = true; P.t = 0; P.foot = 3 - P.foot;
        P.fx = P.x; P.fy = P.y;
        P.gx = (P.tx + dx) * T; P.gy = (P.ty + dy) * T;
      }
    }
  }

  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i];
    p.life += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy -= 12 * dt;
    if (p.life >= p.max) parts.splice(i, 1);
  }
}

function isWater(x, y) {
  const t = (x >= 0 && y >= 0 && x < COLS && y < ROWS) ? map[y][x] : 'T';
  return t === 'W' || t === 'Wo';
}
function drawWater(x, y, withRock) {
  const px = x * T, py = y * T;
  g.drawImage(TILES['W' + (Math.floor(time * 1.5) % 2)], px, py);
  if (withRock) g.drawImage(TILES.WO, px, py);
  const dark = '#1f5fb8', foam = '#bfe6ff';
  if (!isWater(x, y - 1)) { g.fillStyle = dark; g.fillRect(px, py, 16, 1); g.fillStyle = foam; g.fillRect(px, py + 1, 16, 1); }
  if (!isWater(x, y + 1)) { g.fillStyle = dark; g.fillRect(px, py + 15, 16, 1); g.fillStyle = foam; g.fillRect(px, py + 14, 16, 1); }
  if (!isWater(x - 1, y)) { g.fillStyle = dark; g.fillRect(px, py, 1, 16); g.fillStyle = foam; g.fillRect(px + 1, py, 1, 16); }
  if (!isWater(x + 1, y)) { g.fillStyle = dark; g.fillRect(px + 15, py, 1, 16); g.fillStyle = foam; g.fillRect(px + 14, py, 1, 16); }
}
function shadow(px, py) {
  g.fillStyle = 'rgba(12,30,56,0.32)';
  g.fillRect(px + 4, py + 12, 8, 1); g.fillRect(px + 3, py + 13, 10, 2); g.fillRect(px + 4, py + 15, 8, 1);
}

function drawSword(ang) {
  const ox = P.x + 8, oy = P.y + 7;
  const pts = [];
  for (let r = 3; r <= 13; r++) pts.push([Math.round(ox + Math.cos(ang) * r), Math.round(oy + Math.sin(ang) * r), r]);
  g.fillStyle = '#1a1220';
  pts.forEach(([x, y]) => g.fillRect(x - 1, y - 1, 4, 4));
  pts.forEach(([x, y, r]) => {
    g.fillStyle = r <= 4 ? '#6b4a2f' : r >= 12 ? '#f0c8ff' : '#dfe9ff';
    g.fillRect(x, y, 2, 2);
  });
  const gx = ox + Math.cos(ang) * 5, gy = oy + Math.sin(ang) * 5;
  g.fillStyle = '#d9b44a';
  for (let s = -2; s <= 2; s++)
    g.fillRect(Math.round(gx + Math.cos(ang + Math.PI / 2) * s), Math.round(gy + Math.sin(ang + Math.PI / 2) * s), 1, 1);
}
function drawTrail(s) {
  if (s.u <= 0 || s.u >= 1) return;
  for (let k = 1; k <= 6; k++) {
    const a = s.ang - k * 0.18;
    g.globalAlpha = 0.6 - k * 0.08;
    g.fillStyle = k < 3 ? '#d98cff' : '#8a3fe0';
    [10, 12, 14].forEach(r => g.fillRect(Math.round(P.x + 8 + Math.cos(a) * r), Math.round(P.y + 7 + Math.sin(a) * r), 2, 2));
  }
  g.globalAlpha = 1;
}

function drawPlayer() {
  const attacking = P.atk >= 0;
  const s = attacking ? swordInfo() : null;
  const pose = attacking ? 0 : (P.moving ? P.foot : 0);
  const flame = Math.floor(time * 6) % 2;
  let dy = 0;
  if (P.moving && P.t > 0.2 && P.t < 0.8) dy = -1;
  let lx = 0, ly = 0;
  if (attacking && s.t > 0.2 && s.t < 0.65) { lx = DIRS[P.dir][0]; ly = DIRS[P.dir][1]; }

  if (attacking && P.dir === 'up' && s.t < 0.92) { drawTrail(s); drawSword(s.ang); }
  shadow(Math.round(P.x), Math.round(P.y));
  g.drawImage(getSprite(P.dir, pose, flame), Math.round(P.x) - 1 + lx, Math.round(P.y) - 9 + dy + ly);
  if (attacking && P.dir !== 'up' && s.t < 0.92) { drawTrail(s); drawSword(s.ang); }

  const gx = Math.floor((P.x + 8) / T), gy = Math.floor((P.y + 13) / T);
  if (gx >= 0 && gy >= 0 && gx < COLS && gy < ROWS && map[gy][gx] === 'G')
    g.drawImage(TILES.G, 0, 8, 16, 8, gx * T, gy * T + 8, 16, 8);
}
function drawNpc(n) {
  const px = n.tx * T, py = n.ty * T;
  shadow(px, py);
  g.drawImage(npcSprite(n.sprite, Math.floor(time * 2) % 2), px - 1, py - 9);
}

function camAxis(p, view, world) {
  if (world <= view) return -Math.floor((view - world) / 2);
  return Math.round(Math.min(Math.max(p - view / 2, 0), world - view));
}

// ------------------------------------------------------------
//  INTERFAZ: pergamino, HUD, menú y escena del huevo
// ------------------------------------------------------------
function panel(x, y, w, h) {                                  // panel de pergamino viejo
  g.fillStyle = 'rgba(0,0,0,0.3)'; g.fillRect(x + 2, y + h, w, 2);
  g.fillStyle = '#5a3a18'; g.fillRect(x, y, w, h);
  g.fillStyle = '#b89458'; g.fillRect(x + 1, y + 1, w - 2, h - 2);
  g.fillStyle = '#efdcaa'; g.fillRect(x + 2, y + 2, w - 4, h - 4);
  g.fillStyle = '#f7e9c4'; g.fillRect(x + 3, y + 3, w - 6, 1); g.fillRect(x + 3, y + 3, 1, h - 6);
  g.fillStyle = '#e4cc90';
  for (let i = 0; i < 6; i++) g.fillRect(x + 6 + hash(i, w) % Math.max(1, w - 14), y + 6 + hash(i, h) % Math.max(1, h - 14), 3, 2);
}
function drawRoll(x, y, h) {                                  // rodillo del pergamino
  g.fillStyle = '#d9b44a'; g.fillRect(x + 3, y - 3, 4, 3); g.fillRect(x + 3, y + h, 4, 3);
  g.fillStyle = '#8a6a30'; g.fillRect(x, y, 10, 2);
  g.fillStyle = '#caa860'; g.fillRect(x, y + 2, 10, h - 4);
  g.fillStyle = '#a07c3c'; g.fillRect(x, y + 2, 2, h - 4); g.fillRect(x + 8, y + 2, 2, h - 4);
  g.fillStyle = '#f0dca0'; g.fillRect(x + 3, y + 2, 2, h - 4);
  g.fillStyle = '#8a6a30'; g.fillRect(x, y + h - 2, 10, 2);
}
function drawScroll(bx, by, w, h) {
  g.fillStyle = 'rgba(0,0,0,0.3)'; g.fillRect(bx + 3, by + h + 2, w - 3, 2);
  const px = bx + 8, pw = w - 16;
  for (let i = 0; i < pw; i++) {                              // papel con los bordes rotos
    const t = by + 3 + hash(i, 1) % 3, b = by + h - 4 - hash(i, 2) % 3;
    g.fillStyle = '#b89458'; g.fillRect(px + i, t, 1, 1); g.fillRect(px + i, b, 1, 1);
    g.fillStyle = '#efdcaa'; g.fillRect(px + i, t + 1, 1, b - t - 1);
    g.fillStyle = '#e6cf98'; g.fillRect(px + i, t + 1, 1, 1); g.fillRect(px + i, b - 1, 1, 1);
  }
  g.fillStyle = '#e4cc90';                                     // manchas de edad
  for (let i = 0; i < 9; i++) g.fillRect(px + 4 + hash(i, 5) % (pw - 10), by + 8 + hash(i, 6) % (h - 18), 3 + i % 2, 2);
  g.fillStyle = '#d6b878'; g.fillRect(px, by + 4, 2, h - 8); g.fillRect(px + pw - 2, by + 4, 2, h - 8);
  drawRoll(bx, by, h); drawRoll(bx + w - 10, by, h);
}
function arrow(x, y) {
  g.fillStyle = '#8a2a1a';
  g.fillRect(x, y, 1, 7); g.fillRect(x + 1, y + 1, 1, 5); g.fillRect(x + 2, y + 2, 1, 3); g.fillRect(x + 3, y + 3, 1, 1);
}

function drawDialogue() {
  const L = layout();
  if (D.wrapW !== L.tw) rewrap();
  const sp = SPEAK[D.who];
  drawScroll(L.bx, L.by, L.w, L.h);
  if (sp) {                                                    // etiqueta con el nombre
    const nw = Math.ceil(textW(sp.name)) + 10;
    g.fillStyle = '#5a3a18'; g.fillRect(L.bx + 14, L.by - 11, nw, 13);
    g.fillStyle = '#caa860'; g.fillRect(L.bx + 15, L.by - 10, nw - 2, 11);
    ptext(sp.name, L.bx + 19, L.by - 11, '#3a2410');
  }
  if (L.hasP) {                                                // cara de quien habla
    const fy = L.by + 11;
    g.fillStyle = '#5a3a18'; g.fillRect(L.fx, fy, 38, 38);
    g.fillStyle = '#d8b878'; g.fillRect(L.fx + 1, fy + 1, 36, 36);
    g.fillStyle = '#c9a868'; g.fillRect(L.fx + 1, fy + 1, 36, 2); g.fillRect(L.fx + 1, fy + 1, 2, 36);
    g.drawImage(getPortrait(SPEAK[D.who].portrait, D.face), L.fx + 2, fy + 2);
  }
  let rem = Math.floor(D.shown);                               // texto con efecto máquina de escribir
  D.lines.forEach((l, i) => {
    const clip = Math.ceil(textW(l.slice(0, Math.max(0, rem)))) + 1;
    ptext(l, L.tx, L.by + 9 + i * 11, '#3a2410', rem >= l.length ? undefined : clip);
    rem -= l.length;
  });
  if (D.shown >= D.total) {
    if (D.opts) {                                              // opciones
      const ow = Math.max(...D.opts.map(o => Math.ceil(textW(o.label)))) + 30, oh = D.opts.length * 13 + 10;
      const ox = L.bx + L.w - ow - 6, oy = L.by - oh - 14;
      panel(ox, oy, ow, oh);
      D.opts.forEach((o, i) => {
        const yy = oy + 6 + i * 13;
        ptext(o.label, ox + 18, yy, '#3a2410');
        if (i === D.sel) arrow(ox + 8, yy + 2);
      });
    } else if (Math.floor(time * 3) % 2 === 0) {               // ▼ continuar
      g.fillStyle = '#8a2a1a';
      const ax = (L.hasP ? L.fx - 14 : L.px + L.pw - 16), ay = L.by + L.h - 17;
      g.fillRect(ax, ay, 7, 1); g.fillRect(ax + 1, ay + 1, 5, 1); g.fillRect(ax + 2, ay + 2, 3, 1); g.fillRect(ax + 3, ay + 3, 1, 1);
    }
  }
}

// ---- iconos del menú ----
const HEART = ['.XX.XX.', 'XXXXXXX', 'XXXXXXX', '.XXXXX.', '..XXX..', '...X...'];
function heartPat(x, y, col) {
  g.fillStyle = col;
  HEART.forEach((row, j) => { for (let i = 0; i < 7; i++) if (row[i] === 'X') g.fillRect(x + i, y + j, 1, 1); });
}
function heart(x, y, on) {
  [[-1,0],[1,0],[0,-1],[0,1]].forEach(([dx, dy]) => heartPat(x + dx, y + dy, '#1a1220'));
  heartPat(x, y, on ? '#e8302a' : '#6a4a4a');
  if (on) { g.fillStyle = '#ff9a90'; g.fillRect(x + 1, y + 1, 1, 1); }
}
function iconSword(x, y) {
  for (let i = 0; i < 9; i++) { g.fillStyle = '#1a1220'; g.fillRect(x + 3 + i, y + 9 - i, 4, 4); }
  for (let i = 0; i < 9; i++) { g.fillStyle = i > 6 ? '#f0c8ff' : '#dfe9ff'; g.fillRect(x + 4 + i, y + 10 - i, 2, 2); }
  g.fillStyle = '#6b4a2f'; g.fillRect(x + 2, y + 12, 2, 2); g.fillRect(x + 1, y + 13, 2, 2);
  g.fillStyle = '#d9b44a'; for (let k = -2; k <= 2; k++) g.fillRect(x + 5 + k, y + 9 + k, 1, 1);
}
function iconCoin(x, y) {
  for (let j = -5; j <= 5; j++) for (let i = -5; i <= 5; i++) {
    const d = Math.hypot(i, j);
    if (d <= 5.2) { g.fillStyle = d > 4.2 ? '#8a6a10' : '#ffd84a'; g.fillRect(x + 8 + i, y + 8 + j, 1, 1); }
  }
  g.fillStyle = '#fff6b0'; g.fillRect(x + 5, y + 5, 2, 1); g.fillRect(x + 5, y + 6, 1, 1);
  g.fillStyle = '#b08a20'; g.fillRect(x + 7, y + 6, 2, 5);
}
function iconScroll(x, y) {
  g.fillStyle = '#efdcaa'; g.fillRect(x + 3, y + 3, 10, 10);
  g.fillStyle = '#5a3a18'; g.fillRect(x + 3, y + 3, 10, 1); g.fillRect(x + 3, y + 12, 10, 1);
  g.fillStyle = '#caa860'; g.fillRect(x + 1, y + 2, 3, 12); g.fillRect(x + 12, y + 2, 3, 12);
  g.fillStyle = '#8a6a30'; g.fillRect(x + 5, y + 6, 6, 1); g.fillRect(x + 5, y + 8, 5, 1); g.fillRect(x + 5, y + 10, 6, 1);
}
function bar(x, y, max, val, col) {
  for (let i = 0; i < max; i++) {
    g.fillStyle = '#1a1220'; g.fillRect(x + i * 13, y, 12, 8);
    g.fillStyle = i < val ? col : '#6a5a44'; g.fillRect(x + i * 13 + 1, y + 1, 10, 6);
    if (i < val) { g.fillStyle = 'rgba(255,255,255,0.35)'; g.fillRect(x + i * 13 + 1, y + 1, 10, 2); }
  }
}
function head(label, x, y, w) {
  ptext(label, x, y, '#8a2a1a');
  g.fillStyle = '#b89458'; g.fillRect(x, y + 11, w, 1);
}

function drawMenu() {
  g.fillStyle = 'rgba(8,10,30,0.5)'; g.fillRect(0, 0, W, H);   // el juego se ve de fondo, parado
  const S = 124, fw = S + 12, fh = S + 26;
  const fx = W - fw - 10, fy = 10;
  const lx = 10, ly = 10, lw = Math.max(150, fx - lx - 10), lh = H - 20;

  // ---- Panel izquierdo: objetos, vida, magia y fuerza (todo a la vista) ----
  panel(lx, ly, lw, lh);
  let y = ly + 8;
  head('OBJETOS', lx + 8, y, lw - 16); y += 15;
  const rows = [];
  if (dragon.type) rows.push({ icon: 'egg', text: 'Huevo de dragón · ' + EGG_COL[dragon.type].n });
  rows.push({ icon: 'sword', text: 'Espada de Ken' });
  rows.push({ icon: 'coin', text: 'Monedas x' + stats.monedas });
  rows.push({ icon: 'scroll', text: 'Pergamino mágico x0' });
  rows.slice(0, 4).forEach(r => {
    if (r.icon === 'egg') drawEgg(dragon.type, lx + 18, y + 20, 1, time, false);
    if (r.icon === 'sword') iconSword(lx + 10, y + 3);
    if (r.icon === 'coin') iconCoin(lx + 10, y + 3);
    if (r.icon === 'scroll') iconScroll(lx + 10, y + 3);
    ptext(r.text, lx + 34, y + 7, '#3a2410');
    g.fillStyle = '#d6b878'; g.fillRect(lx + 8, y + 21, lw - 16, 1);
    y += 22;
  });
  y += 4;
  head('VIDA', lx + 8, y, lw - 16); y += 15;
  for (let i = 0; i < stats.vidaMax; i++) heart(lx + 10 + i * 11, y, i < stats.vida);
  ptext(stats.vida + '/' + stats.vidaMax, lx + 14 + stats.vidaMax * 11, y - 3, '#3a2410');
  y += 15;
  head('MAGIA', lx + 8, y, lw - 16); y += 15;
  bar(lx + 10, y, stats.magiaMax, stats.magia, '#4a8af0'); y += 15;
  head('FUERZA', lx + 8, y, lw - 16); y += 15;
  bar(lx + 10, y, stats.fuerzaMax, stats.fuerza, '#e8782a');

  // ---- Mapa en un cuadrado a la derecha ----
  panel(fx, fy, fw, fh);
  head('MAPA', fx + 8, fy + 6, fw - 16);
  const sx = fx + 6, sy = fy + 20;
  g.fillStyle = '#3a2a14'; g.fillRect(sx - 1, sy - 1, S + 2, S + 2);
  g.fillStyle = '#1c2a44'; g.fillRect(sx, sy, S, S);
  const mx = sx + Math.floor((S - COLS * 3) / 2), my = sy + Math.floor((S - ROWS * 3) / 2);
  g.drawImage(miniCanvas, mx, my);
  if (Math.floor(time * 3) % 2 === 0) {                        // tú (parpadea)
    g.fillStyle = '#1a1220'; g.fillRect(mx + P.tx * 3 - 1, my + P.ty * 3 - 1, 5, 5);
    g.fillStyle = '#ff3030'; g.fillRect(mx + P.tx * 3, my + P.ty * 3, 3, 3);
  }
  npcs.filter(n => n.sprite).forEach(n => {
    g.fillStyle = '#1a1220'; g.fillRect(mx + n.tx * 3 - 1, my + n.ty * 3 - 1, 5, 5);
    g.fillStyle = n.sprite === 'sage' ? '#c080ff' : '#ffd84a'; g.fillRect(mx + n.tx * 3, my + n.ty * 3, 3, 3);
  });
  stext('Aldea de Rowan', fx + 8, fy + fh + 6, '#ffffff');
  [['#ff3030', 'Tú'], ['#ffd84a', 'Mapache'], ['#c080ff', 'Sabio']].forEach(([c, n], i) => {
    g.fillStyle = '#1a1220'; g.fillRect(fx + 7, fy + fh + 22 + i * 11, 5, 5);
    g.fillStyle = c; g.fillRect(fx + 8, fy + fh + 23 + i * 11, 3, 3);
    stext(n, fx + 16, fy + fh + 19 + i * 11, '#ffffff');
  });
}

function drawReveal() {
  const r = reveal;
  g.fillStyle = 'rgba(6,6,20,0.75)'; g.fillRect(0, 0, W, H);
  const s = Math.max(2, Math.min(5, Math.floor(H / 60)));
  const cx = Math.floor(W / 2), cy = Math.floor(H / 2) + 8 * s;
  const rise = Math.min(1, r.t / 0.8), ease = 1 - (1 - rise) * (1 - rise);
  const col = EGG_COL[r.type];
  g.globalAlpha = 0.10;                                         // rayos de luz que giran
  g.fillStyle = col.g;
  for (let i = 0; i < 10; i++) {
    const a = r.t * 0.4 + i * Math.PI / 5;
    for (let d = 14 * s; d < H; d += 5) g.fillRect(Math.round(cx + Math.cos(a) * d), Math.round(cy - 9 * s + Math.sin(a) * d), 3, 3);
  }
  g.globalAlpha = 1;
  drawEgg(r.type, cx, Math.round(cy + (1 - ease) * 40), s, r.t, true);
  g.globalAlpha = ease;
  const t1 = '¡HUEVO DE DRAGÓN!', t2 = 'Tipo: ' + col.n;
  stext(t1, Math.round(cx - textW(t1)), 12, '#ffffff', 2);
  stext(t2, Math.round(cx - textW(t2) / 2), 40, col.l);
  g.globalAlpha = 1;
  if (r.t > 0.8 && Math.floor(r.t * 2.5) % 2 === 0) {
    const t3 = 'Pulsa E / Intro';
    stext(t3, Math.round(cx - textW(t3) / 2), H - 16, '#ffffff');
  }
}

function drawHud() {
  if (time < 10 && !menu.open) {                                // controles (se desvanecen)
    g.globalAlpha = time < 8 ? 1 : Math.max(0, 1 - (time - 8) / 2);
    const hint = 'Flechas · A atacar · E/Intro hablar · M menú · +/- zoom';
    stext(hint, Math.round(W - textW(hint) - 8), 6, '#ffffff');
    g.globalAlpha = 1;
  }
  if (quest.state === 1 && !menu.open) {
    const t = 'Misión: hongos brillantes';
    panel(4, 4, Math.ceil(textW(t)) + 14, 17);
    ptext(t, 11, 8, '#3a2410');
  }
}

function render() {
  const camX = camAxis(P.x + 8, W, COLS * T);
  const camY = camAxis(P.y + 8, H, ROWS * T);
  g.fillStyle = '#000'; g.fillRect(0, 0, W, H);
  g.save();
  g.translate(-camX, -camY);

  g.drawImage(mapCanvas, 0, 0);
  for (let y = Math.max(0, Math.floor(camY / T)); y <= Math.min(ROWS - 1, Math.ceil((camY + H) / T)); y++)
    for (let x = Math.max(0, Math.floor(camX / T)); x <= Math.min(COLS - 1, Math.ceil((camX + W) / T)); x++) {
      const t = map[y][x];
      if (t === 'W' || t === 'Wo') drawWater(x, y, t === 'Wo');
    }

  const ents = [{ y: P.y, draw: drawPlayer }];
  npcs.filter(n => n.sprite).forEach(n => ents.push({ y: n.ty * T, draw: () => drawNpc(n) }));
  ents.sort((a, b) => a.y - b.y).forEach(e => e.draw());

  if (!D.active) {                                              // "!" sobre quien tiene algo que decirte
    npcs.forEach(n => {
      if (!n.marker || !n.marker()) return;
      const ex = n.tx * T + 6, ey = n.ty * T - n.mk + Math.round(Math.sin(time * 5) * 1.5);
      g.fillStyle = '#1a1220'; g.fillRect(ex - 1, ey - 1, 4, 8); g.fillRect(ex - 1, ey + 7, 4, 4);
      g.fillStyle = '#ffd84a'; g.fillRect(ex, ey, 2, 6); g.fillRect(ex, ey + 8, 2, 2);
    });
  }

  parts.forEach(p => {
    g.globalAlpha = 1 - p.life / p.max;
    g.fillStyle = p.c;
    g.fillRect(Math.round(p.x), Math.round(p.y), p.s, p.s);
  });
  g.globalAlpha = 1;
  g.restore();

  drawHud();
  if (D.active) drawDialogue();
  if (menu.open) drawMenu();
  if (reveal) drawReveal();
}

// ------------------------------------------------------------
//  BUCLE DEL JUEGO
// ------------------------------------------------------------
let last = 0;
function loop(ts) {
  const dt = Math.min((ts - last) / 1000 || 0, 0.05);
  last = ts;
  update(dt);
  render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
